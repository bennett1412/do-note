services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_URL=postgres://donote:${DB_PASSWORD:-donote}@db:5432/donote
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DB_MAX_CONNECTIONS=5
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=donote
      - POSTGRES_PASSWORD=${DB_PASSWORD:-donote}
      - POSTGRES_DB=donote
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donote"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # Resource limits to keep costs down on a 4GB VPS
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    build:
      context: .
      dockerfile: caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
